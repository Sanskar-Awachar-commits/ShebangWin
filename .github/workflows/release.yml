name: Build and Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile ShebangWin
        run: |
          gcc -O3 -s -o compile.exe main.c

      - name: Verify build
        run: |
          .\compile.exe --version
          .\compile.exe --help

      - name: Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $version = "${{ github.ref_name }}".TrimStart('v')
          $pattern = "(?s)## \[$version\].*?(?=(?:\r?\n## \[|\Z))"
          if ($changelog -match $pattern) {
              $matches[0].Trim() | Set-Content release_notes.md
          } else {
              Set-Content release_notes.md -Value "ShebangWin ${{ github.ref_name }}"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compile-windows-x64
          path: compile.exe

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "ShebangWin ${{ github.ref_name }} - Stable"
          body_path: release_notes.md
          files: compile.exe
          make_latest: true
